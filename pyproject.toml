[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "redsun"
dynamic = ["version"]
description = "Event-driven data acquisition software for scientific applications."
readme = "README.md"
authors = [{ name = "Jacopo Abramo", email = "jacopo.abramo@gmail.com" }]
maintainers = [{ name = "Jacopo Abramo", email = "jacopo.abramo@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "License :: OSI Approved :: Apache Software License",
]
license = { text = "Apache-2.0" }
dependencies = [
    "bluesky>=1.15.1",
    "culsans>=0.11.0",
    "dependency-injector>=4.49.1",
    "ophyd-async>=0.21.2",
    "platformdirs>=4.11.0",
    "psygnal>=0.15.1",
    "pyyaml>=6.0.3",
    "typing-extensions>=4.16.0",
]
requires-python = ">=3.11"

[dependency-groups]
dev = [
    { include-group = "pyqt" },
    { include-group = "zarr" },
    "mypy>=2.3.1",
    "prek>=0.5.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.1.5",
    "types-pyyaml>=6.0.12.20250915",
    "ruff>=0.16.5",
    "griffe-fieldz>=0.4.0",
    "pytest-asyncio>=1.3.0",
    "tox-uv>=1.36.0",
]
docs = [
    "mike>=2.1.3",
    "mkdocstrings-python>=2.0.7",
    "zensical>=0.0.57",
]

qt-common = [
    "magicgui>=0.10.2",
    "qtpy>=2.4.3",
]

pyqt = [
    {include-group = "qt-common"},
    "pyqt6>=6.11.0",
]

pyside = [
    {include-group = "qt-common"},
    "pyside6>=6.11.0",
]

zarr = [
    "acquire-zarr>=0.9.0",
]

[project.optional-dependencies]
zarr = [
    "acquire-zarr>=0.8.1",
]
qt-common = [
    "magicgui>=0.10.2",
    "qtpy>=2.4.3",
]
pyqt = [
    "redsun[qt-common]",
    "pyqt6>=6.11.0",
]
pyside = [
    "redsun[qt-common]",
    "pyside6>=6.11.0",
]

[project.entry-points."redsun.plugins"]
redsun = "plugins.yaml"

[project.urls]
bugs = "https://github.com/redsun-acquisition/redsun/issues"
changelog = "https://github.com/redsun-acquisition/redsun/blob/master/changelog.md"
homepage = "https://github.com/redsun-acquisition/redsun"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/redsun"]

[tool.hatch.build.targets.sdist]
include = [
  "src/redsun/**",
  "benchmarks/**",
]

[tool.mypy]
files = "."
exclude = ["docs"]
mypy_path = ["src", "tests/container"]
explicit_package_bases = true
disable_error_code = [
    "import-untyped",
    "no-untyped-call"
]
pretty = true
strict = true
warn_unreachable = true
warn_no_return = true

[tool.coverage.run]
source = ["redsun"]
omit = [
    "tests/conftest.py",
    "src/redsun/view/**",
]

[tool.ruff]
fix = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "D", # enable docstring checks
    "I", # enable imports checks
    "TC", # enable type check imports
    "FA102", # force __future__ imports
] 
ignore = ["D100","D104"] # https://docs.astral.sh/ruff/rules/undocumented-public-package/

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    # ignore missing docstrings in tests
    "D101",
    "D102",
    "D103",
    # ignore type check imports in tests
    "TC",
    # defaults in plan signatures (incl. mutable/call defaults) are exactly
    # what plan-spec introspection exercises
    "B006",
    "B008",
    # naive datetimes mirror SessionPathProvider's local-time directory layout
    "DTZ",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.tox]
requires = ["tox>=4.28", "tox-uv>=1.36"]
env_list = ["lint", "mypy-pyqt", "mypy-pyside", "tests", "docs"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]

[tool.tox.env.lint]
commands = [
    ["ruff", "check", "--fix", "."],
    ["ruff", "format", "."],
]

[tool.tox.env.mypy-pyqt]
dependency_groups = ["dev", "pyqt"]
set_env = { QT_API = "pyqt6" }
commands = [["python", "scripts/mypy_qt.py", "--ignore-missing-imports"]]

[tool.tox.env.mypy-pyside]
dependency_groups = ["dev", "pyside"]
set_env = { QT_API = "pyside6" }
commands = [["python", "scripts/mypy_qt.py", "--ignore-missing-imports"]]

[tool.tox.env.tests]
commands = [["pytest", "-q", { replace = "posargs", extend = true }]]

[tool.tox.env.docs]
dependency_groups = ["dev", "docs"]
commands = [
    ["zensical", "build"],
    ["python", "scripts/check_xrefs.py"],
]

# https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.report]
exclude_lines = [
    "@abstractmethod",
    "if TYPE_CHECKING:",
    "@overload",
    "class .*Protocol",
    "except ImportError",
    "except PackageNotFoundError",
    "raise NotImplementedError()",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
addopts = "-p no:warnings"
asyncio_mode = "auto"
markers = [
    "qt: marks tests that require a Qt display (skipped in headless environments)",
]
env = [
    "QT_QPA_PLATFORM=offscreen",
]
