name: Test one Qt binding

on:
  workflow_call:
    inputs:
      binding:
        description: "The Qt binding to type-check and test against: pyqt6 or pyside6"
        required: true
        type: string
      floor:
        description: "Requirements for the oldest versions the binding accepts, layered over the lock; empty for none"
        required: false
        type: string
        default: ""
    secrets:
      codecov_token:
        required: false

env:
  # the dependency group and the tox suffix of each binding; empty for an
  # unknown one, which the binding job refuses before anything runs
  GROUP: ${{ fromJSON('{"pyqt6":"pyqt","pyside6":"pyside"}')[inputs.binding] }}

jobs:
  binding:
    name: Check the binding
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a binding this workflow doesn't know
        if: env.GROUP == ''
        run: |
          echo "::error::unknown binding '${{ inputs.binding }}': pass pyqt6 or pyside6"
          exit 1

  mypy:
    name: mypy
    needs: [binding]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      # the environment, the binding and the flags all come from
      # [tool.tox] in pyproject.toml, so this runs what a contributor runs
      - name: Run mypy
        run: uv run --locked --only-group tox tox -e mypy-${{ env.GROUP }}

  test:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    needs: [binding]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Set up Qt's system libraries
        if: runner.os == 'Linux'
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true

      - name: Run tests with coverage
        env:
          QT_API: ${{ inputs.binding }}
        run: |
            uv run --locked --no-default-groups --group dev --group ${{ env.GROUP }} coverage run -p -m pytest --color=yes
        shell: bash

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: covreport-${{ inputs.binding }}-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ./.coverage*
          include-hidden-files: true

  floor:
    name: oldest supported binding
    needs: [binding]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        if: inputs.floor != ''

      - name: Install uv
        if: inputs.floor != ''
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Set up Qt's system libraries
        if: inputs.floor != ''
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true

      # the lock holds the newest versions; --with layers the oldest accepted
      # ones over them for this job only
      - name: Run the tests on the oldest versions
        if: inputs.floor != ''
        env:
          QT_API: ${{ inputs.binding }}
          FLOOR: ${{ inputs.floor }}
        run: |
          with=""
          for requirement in $FLOOR; do with="$with --with $requirement"; done
          # fails if the overlay did not win, so the job can't pass on the newest versions
          uv run --locked --no-default-groups --group dev --group ${{ env.GROUP }} $with python -c "
          import importlib.metadata as m, os, sys
          wrong = [r for r in os.environ['FLOOR'].split() if m.version(r.split('==')[0]) != r.split('==')[1]]
          print('running on', os.environ['FLOOR'])
          sys.exit(f'not the floor versions: {wrong}' if wrong else 0)
          "
          uv run --locked --no-default-groups --group dev --group ${{ env.GROUP }} $with pytest -q --color=yes

  upload_coverage:
    name: Upload coverage
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: covreport-${{ inputs.binding }}-*
          path: covreports
          merge-multiple: true

      - name: Combine coverage data
        run: |
          uv run --locked --only-group coverage coverage combine covreports
          uv run --locked --only-group coverage coverage xml -o coverage.xml
          uv run --locked --only-group coverage coverage report
          uv run --locked --only-group coverage coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload to codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          verbose: true
          flags: ${{ inputs.binding }}
          token: ${{ secrets.codecov_token }}

  # what the ruleset requires: a job skipped because a dependency failed
  # counts as passed, so this runs regardless and fails on its own
  passed:
    name: ${{ inputs.binding }} passed
    if: ${{ !cancelled() }}
    needs: [binding, mypy, test, floor]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
