name: Check code formatting and type hints

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      event_name:
        required: true
        type: string

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.0
          args: "check --fix"
          src: "."

  mypy-pyqt:
    strategy:
        matrix:
            python-version: ["3.14"]
            frontend: ["pyside", "pyqt"]
            os: [ubuntu-latest]
            include:
                - frontend: pyside
                  qt-api: pyside6
                - frontend: pyqt
                  qt-api: pyqt6

    name: mypy with Qt
    runs-on: ${{ matrix.os }}
    env:
        # dev pulls pyqt6 unconditionally; pin the binding qtpy resolves
        # against so the pyside leg actually checks pyside6
        QT_API: ${{ matrix.qt-api }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --group dev --group ${{ matrix.frontend }}

      # config-driven invocation (no path argument) so tests and
      # benchmarks stay in scope — see CLAUDE.md
      - name: Run mypy
        run: uv run mypy --ignore-missing-imports $(uv run qtpy mypy-args)
