name: Check code formatting and type hints

on:
  workflow_call:

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # no --fix: ruff exits 0 once it has fixed everything, so a fixable
      # violation would pass here and reach the branch unnoticed
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock
          args: "check"
          src: "."
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock
          args: "format --check"
          src: "."

  mypy:
    name: mypy with Qt
    runs-on: ubuntu-latest
    strategy:
      matrix:
        frontend: ["pyside", "pyqt"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      # the environment, the binding and the flags all come from
      # [tool.tox] in pyproject.toml, so this runs what a contributor runs
      - name: Run mypy
        run: uv run tox -e mypy-${{ matrix.frontend }}
