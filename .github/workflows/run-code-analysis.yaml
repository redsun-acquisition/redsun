name: Check code formatting

on:
  workflow_call:

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      # the same hooks a commit runs; a hook that rewrites a file fails the
      # run, so a fixable ruff violation still fails here
      - name: Run prek hooks
        run: uv run --locked --only-group lint prek run --all-files --show-diff-on-failure
