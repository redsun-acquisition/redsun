name: Check code formatting and type hints

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      event_name:
        required: true
        type: string

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # no --fix: ruff exits 0 once it has fixed everything, so a fixable
      # violation would pass here and reach the branch unnoticed
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.16.5
          args: "check"
          src: "."
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.16.5
          args: "format --check"
          src: "."

  mypy:
    strategy:
        matrix:
            python-version: ["3.14"]
            frontend: ["pyside", "pyqt"]
            os: [ubuntu-latest]

    name: mypy with Qt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # the environment, the binding and the flags all come from
      # [tool.tox] in pyproject.toml, so this runs what a contributor runs
      - name: Run mypy
        run: uv run tox -e mypy-${{ matrix.frontend }}
