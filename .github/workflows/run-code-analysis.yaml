name: Check code formatting and type hints

on:
  workflow_call:

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      # the same hooks a commit runs; a hook that rewrites a file fails the
      # run, so a fixable ruff violation still fails here
      - name: Run prek hooks
        run: uv run --locked --only-group lint prek run --all-files --show-diff-on-failure

  mypy:
    name: mypy with Qt
    runs-on: ubuntu-latest
    strategy:
      matrix:
        frontend: ["pyside", "pyqt"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      # the environment, the binding and the flags all come from
      # [tool.tox] in pyproject.toml, so this runs what a contributor runs
      - name: Run mypy
        run: uv run tox -e mypy-${{ matrix.frontend }}
