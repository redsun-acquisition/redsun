name: CI Pipeline

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:

# a newer push to main must not cancel a run that is publishing the docs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code_analysis:
    name: Run Code Analysis
    uses: ./.github/workflows/run-code-analysis.yaml

  # pull requests and main test each binding in its own workflow
  # (pyqt6.yaml, pyside6.yaml); a tag tests both here, before building
  tests_pyqt6:
    name: Test PyQt6
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/test-binding.yaml
    with:
      binding: pyqt6
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  tests_pyside6:
    name: Test PySide6
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/test-binding.yaml
    with:
      binding: pyside6
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Check Documentation
    uses: ./.github/workflows/check-docs.yaml

  compose:
    name: Run Compose Tests
    uses: ./.github/workflows/run-compose-tests.yaml

  # the one check the ruleset requires: a job skipped because a dependency
  # failed counts as passed, so this runs regardless and fails on its own
  all_checks:
    name: All Checks Passed
    if: ${{ !cancelled() }}
    needs: [code_analysis, docs, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  publish_docs:
    name: Publish Documentation
    needs: [code_analysis, docs, tests_pyqt6, tests_pyside6]
    # main and final tags only: a release candidate publishes a package and
    # leaves the site describing the last release; on main the test jobs are
    # skipped, which must not hold the docs back, while a failed one must
    if: >-
      !cancelled() && github.event_name == 'push' && !contains(github.ref_name, 'rc')
      && needs.code_analysis.result == 'success' && needs.docs.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/publish-docs.yaml
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false

  build:
    name: Build Package
    needs: [code_analysis, docs, tests_pyqt6, tests_pyside6]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the changelog has a section for a final release
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            python3 scripts/release_notes.py extract "${GITHUB_REF_NAME#v}" > /dev/null
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build a binary wheel and a source tarball
        run: uv build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
        name: pypi
        url: https://pypi.org/p/redsun
    permissions:
        id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
        - name: Download all the dists
          uses: actions/download-artifact@v8
          with:
            name: python-package-distributions
            path: dist/
        - name: Publish distribution 📦 to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish the GitHub release
    needs: publish-to-pypi
    # final tags only: a release candidate's entries stay in changelog.d for
    # the final release's section
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Write the release's notes from its changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          python3 scripts/release_notes.py extract "${GITHUB_REF_NAME#v}" > notes.md
          # a release published from the interface already exists; a tag pushed
          # from a clone has none yet
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
