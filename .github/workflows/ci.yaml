name: CI Pipeline

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:

# a newer push to main must not cancel a run that is publishing the docs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code_analysis:
    name: Run Code Analysis
    uses: ./.github/workflows/run-code-analysis.yaml

  tests:
    name: Run Tests
    uses: ./.github/workflows/run-tests.yaml
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Check Documentation
    uses: ./.github/workflows/check-docs.yaml

  compose:
    name: Run Compose Tests
    uses: ./.github/workflows/run-compose-tests.yaml

  # the one check the ruleset requires: a job skipped because a dependency
  # failed counts as passed, so this runs regardless and fails on its own
  all_checks:
    name: All Checks Passed
    if: ${{ !cancelled() }}
    needs: [code_analysis, tests, docs, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  publish_docs:
    name: Publish Documentation
    needs: [code_analysis, tests, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-docs.yaml
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false

  build:
    name: Build Package
    needs: [code_analysis, tests, docs]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Build a binary wheel and a source tarball
        run: uv build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
        name: pypi
        url: https://pypi.org/p/redsun
    permissions:
        id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
        - name: Download all the dists
          uses: actions/download-artifact@v8
          with:
            name: python-package-distributions
            path: dist/
        - name: Publish distribution 📦 to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1
