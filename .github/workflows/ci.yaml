name: CI Pipeline

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:

# a newer push to main must not cancel a run that is publishing the docs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint and type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      # the same environments a contributor runs; a hook that rewrites a file
      # fails the run, so a fixable ruff violation still fails here
      - name: Run the commit hooks and mypy against both bindings
        run: uv run --locked --only-group tox tox -e lint,mypy-pyqt,mypy-pyside

  docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"

      # the build runs the tutorial's session to take a picture of its window
      - name: Set up a display for Qt
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true

      - name: Build docs and check cross-references
        run: uv run --locked --only-group tox tox -e docs

      # the publish job deploys this artifact rather than building again,
      # so what reaches Pages is what was checked
      - name: Store the built site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          if-no-files-found: error
          retention-days: 7

  compose:
    name: Run Compose Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      # tests/conftest.py imports Qt, so collecting any test needs its libraries
      - name: Install Qt system libraries
        run: |
            sudo apt-get update
            sudo apt-get install -y libegl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0 x11-utils libxcb-cursor0 libopengl0

      - name: Start the IOC
        run: docker compose -f tests/compose/compose.yaml up --detach --wait

      - name: Run the tests marked compose
        run: uv run --locked pytest -m compose --color=yes
        env:
          REDSUN_COMPOSE: "1"

      - name: Show the IOC's output
        if: ${{ !cancelled() }}
        run: docker compose -f tests/compose/compose.yaml logs

      - name: Stop the IOC
        if: ${{ !cancelled() }}
        run: docker compose -f tests/compose/compose.yaml down

  tests:
    name: ${{ matrix.binding }} ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        binding: [pyqt6, pyside6]
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # every Python on Ubuntu; the two ends of the range elsewhere
        exclude:
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
        # the dependency group holding each binding
        include:
          - binding: pyqt6
            group: pyqt
          - binding: pyside6
            group: pyside
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Set up Qt's system libraries
        if: runner.os == 'Linux'
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true

      # no default groups, so the other binding is not installed
      - name: Run tests with coverage
        env:
          QT_API: ${{ matrix.binding }}
        run: uv run --locked --no-default-groups --group dev --group ${{ matrix.group }} coverage run -p -m pytest --color=yes -n auto --dist loadfile
        shell: bash

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: covreport-${{ matrix.binding }}-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ./.coverage*
          include-hidden-files: true

  # environments of their own: the qlementine style's package is an extra,
  # and its pyside6 one holds pyside6 at one version; the floor layers the
  # oldest pyside6 redsun accepts over the lock
  extras:
    name: qlementine style and oldest pyside6
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # moves with the pyside extra's lower bound in pyproject.toml
      FLOOR: pyside6-essentials==6.10.2 shiboken6==6.10.2
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Set up Qt's system libraries
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true

      # --exact, so each run leaves out the binding the run before installed
      - name: Run the style's tests on pyqt6 with coverage
        env:
          QT_API: pyqt6
        run: uv run --locked --exact --no-default-groups --group dev --group qlementine-pyqt coverage run -p -m pytest --color=yes tests/test_qlementine_style.py tests/test_cli.py

      - name: Run the style's tests on pyside6 with coverage
        env:
          QT_API: pyside6
        run: uv run --locked --exact --no-default-groups --group dev --group qlementine-pyside coverage run -p -m pytest --color=yes tests/test_qlementine_style.py tests/test_cli.py

      # the lock holds the newest versions; --with layers the oldest accepted
      # ones over them for this step only
      - name: Run the tests on the oldest pyside6
        env:
          QT_API: pyside6
        run: |
          with=""
          for requirement in $FLOOR; do with="$with --with $requirement"; done
          # fails if the overlay did not win, so the step can't pass on the newest versions
          uv run --locked --exact --no-default-groups --group dev --group pyside $with python -c "
          import importlib.metadata as m, os, sys
          wrong = [r for r in os.environ['FLOOR'].split() if m.version(r.split('==')[0]) != r.split('==')[1]]
          print('running on', os.environ['FLOOR'])
          sys.exit(f'not the floor versions: {wrong}' if wrong else 0)
          "
          uv run --locked --exact --no-default-groups --group dev --group pyside $with pytest -q --color=yes -n auto --dist loadfile

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: covreport-qlementine
          path: ./.coverage*
          include-hidden-files: true

  coverage:
    name: Upload coverage
    if: ${{ !cancelled() }}
    needs: [tests, extras]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: covreport-*
          path: covreports
          merge-multiple: true

      - name: Combine coverage data
        run: |
          uv run --locked --only-group coverage coverage combine covreports
          uv run --locked --only-group coverage coverage xml -o coverage.xml
          uv run --locked --only-group coverage coverage report
          uv run --locked --only-group coverage coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload to codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # the one check the ruleset requires: a job skipped because a dependency
  # failed counts as passed, so this runs regardless and fails on its own
  all_checks:
    name: All Checks Passed
    if: ${{ !cancelled() }}
    needs: [checks, docs, compose, tests, extras]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  # main and final tags only: a release candidate publishes a package and
  # leaves the site describing the last release
  publish_docs:
    name: Publish Documentation
    needs: [all_checks]
    if: github.event_name == 'push' && !contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site

  build:
    name: Build Package
    needs: [all_checks]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the changelog has a section for a final release
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            python3 scripts/release_notes.py extract "${GITHUB_REF_NAME#v}" > /dev/null
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Build a binary wheel and a source tarball
        run: uv build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
        name: pypi
        url: https://pypi.org/p/redsun
    permissions:
        id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
        - name: Download all the dists
          uses: actions/download-artifact@v8
          with:
            name: python-package-distributions
            path: dist/
        - name: Publish distribution 📦 to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1

  # final tags only: a release candidate's entries stay in changelog.d for
  # the final release's section
  github-release:
    name: Write the GitHub release notes
    needs: publish-to-pypi
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Write the release's notes from its changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py extract "${GITHUB_REF_NAME#v}" > notes.md
          # a release published from the interface already exists; a tag pushed
          # from a clone has none yet
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
