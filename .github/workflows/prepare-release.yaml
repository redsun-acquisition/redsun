name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.15.0, without the v"
        required: true
        type: string
      dry_run:
        description: "Only show the changelog section, in the run's summary"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Write the changelog section and open the release pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version must look like 0.15.0, without the v; got '$VERSION'."
            echo "Tag a release candidate instead of preparing it."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Write the section
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx towncrier==26.9.0 build --yes --version "$VERSION" --date "$(date -u +%d-%m-%Y)"
          python3 scripts/release_notes.py extract "$VERSION" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open the release pull request
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/v$VERSION"
          git switch -c "$branch"
          git commit -m "docs: write the $VERSION changelog"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --label skip-changelog \
            --title "docs: write the $VERSION changelog" --body-file notes.md
