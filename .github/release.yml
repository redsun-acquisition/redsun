# How GitHub groups a release's pull requests: one heading per Keep a Changelog
# section, by label. scripts/release_notes.py turns the result into the section
# written into docs/reference/changelog.md.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Added
      labels: [added]
    - title: Changed
      labels: [changed]
    - title: Deprecated
      labels: [deprecated]
    - title: Removed
      labels: [removed]
    - title: Fixed
      labels: [fixed]
    - title: Security
      labels: [security]
