[project]
site_name = "Redsun"
site_url = "https://redsun-acquisition.github.io/redsun"
site_description = "Event-driven data acquisition software for scientific applications"
site_author = "Jacopo Abramo"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/redsun-acquisition/redsun"
repo_name = "redsun-acquisition/redsun"

extra_css = ["stylesheets/custom.css"]

[project.theme]
variant = "modern"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.indexes",
    "navigation.top",
    "navigation.footer",
    "search.suggest",
    "search.highlight",
    "search.share",
    "content.code.copy",
    "content.code.annotate",
    "content.tabs.link",
    "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle = { icon = "material/brightness-auto", name = "Switch to light mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "red"
accent = "red"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "red"
accent = "red"
toggle = { icon = "material/brightness-4", name = "Switch to system preference" }

