[project]
site_name = "Redsun"
site_url = "https://redsun-acquisition.github.io/redsun"
site_description = "Event-driven data acquisition software for scientific applications"
site_author = "Jacopo Abramo"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/redsun-acquisition/redsun"
repo_name = "redsun-acquisition/redsun"

[project.theme]
variant = "modern"
font.text = "Inter"
font.code = "Fira Code"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.indexes",
    "navigation.path",
    "navigation.top",
    "navigation.footer",
    "search.suggest",
    "search.highlight",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "toc.follow",
]

[project.theme.icon]
logo = "lucide/sunrise"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "red"
accent = "red"
toggle = { icon = "lucide/sun", name = "Switch to dark mode" }

[[project.theme.palette]]
scheme = "slate"
primary = "red"
accent = "red"
toggle = { icon = "lucide/moon", name = "Switch to light mode" }

nav = [
    "index.md",
    { "Tutorials" = [
        "tutorials/index.md",
        "tutorials/installation.md",
        "tutorials/first-session.md",
    ]},
    { "How-to Guides" = [
        "how-to/index.md",
        "how-to/add-menu-actions.md",
        "how-to/build-docs.md",
        "how-to/change-a-setting-while-a-plan-runs.md",
        "how-to/commits-and-prs.md",
        "how-to/configure-logging.md",
        "how-to/contribute.md",
        "how-to/install-hooks.md",
        "how-to/keep-a-catalog.md",
        "how-to/make-a-release.md",
        "how-to/migrate-from-0.13.md",
        "how-to/record-a-decision.md",
        "how-to/run-commit-checks.md",
        "how-to/run-tests.md",
        "how-to/save-a-session.md",
        "how-to/set-up-development.md",
        "how-to/share-a-value.md",
        "how-to/wire-components.md",
        "how-to/write-a-component.md",
        "how-to/write-a-derived-product.md",
        "how-to/write-a-service.md",
        "how-to/write-a-session-file.md",
        "how-to/write-docs.md",
    ]},
    { "Explanations" = [
        "explanation/index.md",
        "explanation/catalog.md",
        "explanation/components.md",
        "explanation/derived-products.md",
        "explanation/frontends.md",
        "explanation/limits.md",
        "explanation/plans.md",
        "explanation/plugins.md",
        "explanation/qt-widgets.md",
        "explanation/questions.md",
        "explanation/services.md",
        "explanation/session.md",
        "explanation/statement.md",
        { "Architectural Decision Records" = [
            "explanation/decisions/index.md",
            "explanation/decisions/0001-record-architecture-decisions.md",
            "explanation/decisions/0002-storage-dual-context-redesign.md",
            "explanation/decisions/0003-structural-subtyping-for-presenters-and-views.md",
            "explanation/decisions/0004-owner-scoped-signal-lookup.md",
            "explanation/decisions/0005-culsans-psygnal-async-backend.md",
            "explanation/decisions/0006-application-declared-wiring.md",
            "explanation/decisions/0007-typed-provider-keys.md",
            "explanation/decisions/0008-container-hooks-and-the-phase-registry.md",
            "explanation/decisions/0009-inherited-component-configuration.md",
            "explanation/decisions/0010-toolkit-hook-points.md",
            "explanation/decisions/0011-tolerating-a-component-that-fails-to-build.md",
            "explanation/decisions/0012-services-and-two-connection-levels.md",
            "explanation/decisions/0013-acquisition-storage-belongs-to-the-device.md",
            "explanation/decisions/0014-typed-session-files-and-manifests.md",
            "explanation/decisions/0015-collaborators-arrive-in-setup.md",
            "explanation/decisions/0016-a-component-refused-at-declaration-is-skipped.md",
            "explanation/decisions/0017-questions-read-from-the-annotation.md",
        ]},
    ]},
    { "Reference" = [
        "reference/index.md",
        { "API" = [
            "reference/api/session.md",
            "reference/api/injection.md",
            "reference/api/registry.md",
            "reference/api/ports.md",
            "reference/api/qt.md",
            "reference/api/view.md",
            "reference/api/presenter.md",
            "reference/api/engine.md",
            "reference/api/services.md",
            "reference/api/path_provider.md",
            "reference/api/catalog.md",
            "reference/api/writers.md",
            "reference/api/aio.md",
            "reference/api/log.md",
            "reference/api/utils.md",
        ]},
        "reference/glossary.md",
        "reference/changelog.md",
        "reference/previous-changelog.md",
    ]},
]

[project.plugins.search]
[project.plugins.autorefs]
[project.plugins.mkdocstrings]
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = [
    "https://psygnal.readthedocs.io/en/latest/objects.inv",
    "https://docs.python.org/3/objects.inv",
    "https://blueskyproject.io/bluesky/main/objects.inv",
    "https://blueskyproject.io/ophyd-async/main/objects.inv",
    "https://python-dependency-injector.ets-labs.org/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_source = false
docstring_section_style = "table"
merge_init_into_class = true
show_root_heading = false
show_root_full_path = false
show_signature_annotations = true
separate_signature = true
members_order = "source"
group_by_category = true
show_symbol_type_heading = true
show_symbol_type_toc = true
filters = ["!^_", "!^__"]

[[project.plugins.mkdocstrings.handlers.python.options.extensions]]
griffe_fieldz = { add_fields_to = "docstring-attributes", include_inherited = false, include_private = false, remove_fields_from_members = true, strip_annotated = true }

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}

[project.markdown_extensions.toc]
permalink = true
toc_depth = 3

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"

[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

# includes/abbreviations.md is appended to every page, so each entry underlines
# every occurrence of its term site-wide. Keep it to acronyms and terms that are
# rare in prose; a common word such as "presenter" or "slot" belongs in
# docs/reference/glossary.md alone.
[project.markdown_extensions.pymdownx.snippets]
auto_append = ["includes/abbreviations.md"]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/redsun-acquisition/redsun"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/redsun/"
